<html>
    <head>
        <title>properties of positioning</title>
        <style>
        div{
            right:30px; 
            border:3px solid #73ad21;
        }
        div.absolute{
            position:absolute;
            left:50px;
            border:3px solid blue;
            z-index: 4px;
        }
        div.relative{
            position:relative;
            left:100px;
            border:3px solid #73ad21;
            z-index: 3px;
        }
        div.fixed{
            position:fixed;
            top:0;
            right:20px;
            width:300px;
            border:3px solid #73ad21;
            z-index:5px;
        }
        div.sticky{
            position:sticky;
            top:1px;
            left:20px;
            width:100px;
            border:3px solid #73ad21;
            z-index: 6px;
        }
        </style>
    </head>
    <body>
        <h2>positioning</h2>
        <div>div with no position properties</div>
        <div class="sticky">div with sticky position properties</div>
        <div class="relative">div element has position relative<div class="absolute">absolute class div</div></div>
        <div class="fixed">div with fixed position properties</div>
        <div style="height:360px; border:none;"></div>
    </body>
</html>
